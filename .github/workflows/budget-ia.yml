name: Budget IA (análise diária)

# Todo dia 09:41 UTC (06:41 Brasília) + disparo manual.
# Minuto quebrado e fora da hora cheia de propósito: agendamento na hora cheia
# entra na fila do Actions e atrasa 2-3h (já medido neste repo).
#
# O escopo muda conforme o dia (decidido dentro do robô, no fuso de Brasília):
#   - todo dia: só as campanhas em veiculação agora;
#   - segunda:  também as que veicularam em algum momento nos últimos 7 dias.
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      escopo:
        description: 'Escopo da rodada (auto = decide pelo dia da semana)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'ativas', 'amplo']

concurrency:
  group: budget-ia
  cancel-in-progress: false

jobs:
  analise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar análise de budget
        env:
          ANTHROPIC_API_KEY_TRAFEGO: ${{ secrets.ANTHROPIC_API_KEY_TRAFEGO }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUDGET_ESCOPO: ${{ inputs.escopo }}
        run: node coletor/budget-ia.mjs
