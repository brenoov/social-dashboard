name: Coletor de Notícias (Observatório Vessel)

# Roda toda segunda às 09:00 UTC (06:00 Brasília). Também dá pra disparar à mão.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

concurrency:
  group: coletor-noticias
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      SUPABASE_URL: https://kounqtdoioootxqegkij.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      MODEL_SONNET: claude-sonnet-4-6
      MODEL_OPUS: claude-opus-4-8
      COLETOR_MODEL: claude-sonnet-4-6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Definir rodada (data BR)
        run: echo "RODADA=$(TZ=America/Sao_Paulo date +%F)" >> "$GITHUB_ENV"

      - name: 1/6 · Lojas (best-sellers + novidades)
        run: node coletor/passo-lojas.mjs

      - name: 2/6 · Instagram (Top Viral + Últimos Posts + Reels)
        run: node coletor/ig-coletor.mjs

      - name: 3/6 · Editorial (manchetes via web search · Sonnet)
        run: node coletor/agente-noticias.mjs

      - name: 4/6 · Enriquecimento (Desenvolvimento + análises Sonnet · resumos Opus)
        run: node coletor/passo-enriquece.mjs

      - name: 5/6 · Faxina do storage (GC de mídia órfã)
        run: node coletor/passo-faxina.mjs

      - name: 6/6 · Guarda de completude (audita + alerta)
        if: ${{ always() }}
        run: node coletor/passo-verifica.mjs
