name: Validar Orçamento CBO/ABO (combos ao vivo)
# Roda o validador dos 4 combos (ABO/CBO × Diário/Total) contra o Meta: cria 1 campanha
# PAUSED por combo, checa se o Graph ACEITA ou REJEITA (com subcode), e APAGA tudo no fim.
# Money-path: nada é ativado, nada é gasto. Disparo manual (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      loja:
        description: 'loja (tivoli|dp)'
        required: false
        default: 'tivoli'
concurrency: { group: validar-orcamento, cancel-in-progress: false }
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: Instalar deps do coletor
        run: cd coletor && npm ci
      - name: Rodar validador dos 4 combos (PAUSED + apaga)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # loginServico() autentica como usuário de serviço (mesma coisa da fabrica.yml)
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
          # input por env var (não interpolar direto no run: — evita injeção de shell)
          LOJA: ${{ github.event.inputs.loja }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-orcamento-combos.mjs --loja "$LOJA"
