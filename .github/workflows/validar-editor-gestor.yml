name: Validar o Gestor contra a conta real (ao vivo)
# Prova a única afirmação do editor que nenhum teste unitário alcança: que ele
# PRESERVA o que não gerencia. Isso é uma afirmação sobre o que a META faz com o
# payload, não sobre o nosso objeto — e a Meta já desmentiu este projeto antes.
#
# Cria 1 campanha + 1 conjunto PAUSED com targeting rico, edita pelas MESMAS
# funções da tela, lê de volta campo a campo e APAGA tudo no fim.
# Money-path: nada é ativado, nada gasta. Só disparo manual.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'o que validar'
        required: false
        default: 'editor'
        type: choice
        options: ['editor', 'duplicar']
      manter:
        description: 'manter a campanha de teste no fim (para conferir no Gerenciador)'
        required: false
        default: 'nao'
        type: choice
        options: ['nao', 'sim']
concurrency: { group: validar-editor-gestor, cancel-in-progress: false }
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: Instalar deps do coletor
        run: cd coletor && npm ci

      # Dois passos de comando FIXO escolhidos por `if`, como no robô de
      # interesses: nada vindo de fora entra na linha de comando. A lição do
      # `modo != 'seco'` vale aqui — cada passo declara em que caso roda.
      - name: Validar o EDITOR e apagar no fim
        if: ${{ inputs.alvo != 'duplicar' && inputs.manter != 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-editor-do-gestor.mjs

      - name: Validar o EDITOR e MANTER a campanha
        if: ${{ inputs.alvo != 'duplicar' && inputs.manter == 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-editor-do-gestor.mjs --manter

      # O Duplicar cria DUAS campanhas (original + cópia) e apaga as duas.
      # Passo separado pelo mesmo princípio do robô de interesses: comando fixo
      # escolhido por `if`, nada de fora entrando na linha de comando.
      - name: Validar o DUPLICAR e apagar no fim
        if: ${{ inputs.alvo == 'duplicar' && inputs.manter != 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-duplicar.mjs

      - name: Validar o DUPLICAR e MANTER as campanhas
        if: ${{ inputs.alvo == 'duplicar' && inputs.manter == 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-duplicar.mjs --manter
