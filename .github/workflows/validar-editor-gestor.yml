name: Validar o Gestor contra a conta real (ao vivo)
# Prova a única afirmação do editor que nenhum teste unitário alcança: que ele
# PRESERVA o que não gerencia. Isso é uma afirmação sobre o que a META faz com o
# payload, não sobre o nosso objeto — e a Meta já desmentiu este projeto antes.
#
# Cria 1 campanha + 1 conjunto PAUSED com targeting rico, edita pelas MESMAS
# funções da tela, lê de volta campo a campo e APAGA tudo no fim.
# Money-path: nada é ativado, nada gasta. Só disparo manual.
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'o que validar'
        required: false
        default: 'editor'
        type: choice
        options: ['editor', 'duplicar', 'criativo', 'permissoes', 'criar', 'envio', 'appreview']
      manter:
        description: 'manter a campanha de teste no fim (para conferir no Gerenciador)'
        required: false
        default: 'nao'
        type: choice
        options: ['nao', 'sim']
concurrency: { group: validar-editor-gestor, cancel-in-progress: false }
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - name: Instalar deps do coletor
        run: cd coletor && npm ci

      # Dois passos de comando FIXO escolhidos por `if`, como no robô de
      # interesses: nada vindo de fora entra na linha de comando. A lição do
      # `modo != 'seco'` vale aqui — cada passo declara em que caso roda.
      - name: Validar o EDITOR e apagar no fim
        if: ${{ inputs.alvo == 'editor' && inputs.manter != 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-editor-do-gestor.mjs

      - name: Validar o EDITOR e MANTER a campanha
        if: ${{ inputs.alvo == 'editor' && inputs.manter == 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-editor-do-gestor.mjs --manter

      # O Duplicar cria DUAS campanhas (original + cópia) e apaga as duas.
      # Passo separado pelo mesmo princípio do robô de interesses: comando fixo
      # escolhido por `if`, nada de fora entrando na linha de comando.
      - name: Validar o DUPLICAR e apagar no fim
        if: ${{ inputs.alvo == 'duplicar' && inputs.manter != 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-duplicar.mjs

      - name: Validar o DUPLICAR e MANTER as campanhas
        if: ${{ inputs.alvo == 'duplicar' && inputs.manter == 'sim' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-duplicar.mjs --manter

      # Sonda de leitura pura: descobre o que a Meta entrega para MOSTRAR um
      # anúncio, antes de a lupa da Fila ser escrita. Sem IA, sem gravar nada.
      - name: Sondar o que dá para mostrar de um anúncio (sem IA, R$ 0)
        if: ${{ inputs.alvo == 'criativo' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs sondar-criativo-do-anuncio.mjs

      # Sonda de LEITURA sobre permissões: responde de uma vez o (#200) do
      # Duplicar e o bloqueio de criar público. Cria no máximo um público de
      # teste e o apaga. Sem IA.
      - name: Sondar permissões da Meta (sem IA, R$ 0)
        if: ${{ inputs.alvo == 'permissoes' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs sondar-permissoes-meta.mjs

      # A CADEIA campanha → conjunto → anúncio, nos quatro objetivos. É a prova
      # que precisa existir ANTES da tela de criar campanha (o C3): escrever tela
      # sobre payload não provado faz o erro aparecer no clique do dono.
      - name: Validar criar do zero (PAUSED, apaga no fim)
        if: ${{ inputs.alvo == 'criar' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-criar-no-gestor.mjs

      # O caminho da imagem enviada: arquivo → Storage → Meta → image_hash. É o
      # único pedaço do C3 sem prova, e o único que passa pela trava anti-SSRF
      # do meta-proxy.
      - name: Validar envio de imagem (Storage → Meta)
        if: ${{ inputs.alvo == 'envio' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs validar-envio-de-imagem.mjs

      # Sonda de LEITURA sobre o App Review: o que o token já pode, e quais
      # endpoints de verdade recusam. Não publica, não cria contêiner de mídia.
      - name: Sondar o App Review (leitura pura, R$ 0)
        if: ${{ inputs.alvo == 'appreview' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GESTOR_USER_EMAIL: ${{ secrets.GESTOR_USER_EMAIL }}
          GESTOR_USER_PASSWORD: ${{ secrets.GESTOR_USER_PASSWORD }}
        run: cd coletor && node --import ./lib/curl-fetch.mjs sondar-app-review.mjs
