name: Status dos Projetos (Painel do Claude)

# Deriva o status de desenvolvimento dos projetos a partir dos planos markdown
# (docs/superpowers/plans) e grava em projetos_status. Alimenta o Painel de
# Status do Claude. Roda a cada push que mexe nos planos, e sob demanda.
on:
  push:
    paths:
      - 'docs/superpowers/plans/**'
      - 'docs/superpowers/specs/**'
  workflow_dispatch:

jobs:
  status-projetos:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://kounqtdoioootxqegkij.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Derivar status dos projetos
        run: node coletor/status-projetos.mjs
